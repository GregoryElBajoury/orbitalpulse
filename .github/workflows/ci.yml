name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          # Vérifie les erreurs de syntaxe critiques et variables non définies
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avertissements généraux en mode non bloquant
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with pytest
        env:
          DB_HOST: "localhost"
          DB_PORT: "5432"
          POSTGRES_DB: "orbitalpulse_test"
          POSTGRES_USER: "test_user"
          POSTGRES_PASSWORD: "test_password"
        run: |
          pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint # Ne se lance que si les tests et le lint passent avec succès

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Validation du build uniquement, pas de push sur un registry pour l'instant
          tags: orbitalpulse-collector:test