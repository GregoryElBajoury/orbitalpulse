services:
  postgres:
    image: postgres:15-alpine
    container_name: orbitalpulse_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - orbitalpulse-net

  adminer:
    image: adminer:latest
    container_name: orbitalpulse_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - orbitalpulse-net

volumes:
  pg_data:

networks:
  orbitalpulse-net:
    driver: bridge