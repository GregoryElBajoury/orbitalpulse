services:
  postgres:
    image: postgres:15-alpine
    container_name: orbitalpulse_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - orbitalpulse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: orbitalpulse_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - orbitalpulse-net

  collector:
    build: .
    container_name: orbitalpulse_collector
    restart: on-failure
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - ISS_API_URL=https://api.wheretheiss.at/v1/satellites/25544
    networks:
      - orbitalpulse-net
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:

networks:
  orbitalpulse-net:
    driver: bridge