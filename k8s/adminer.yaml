apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitalpulse-adminer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbitalpulse-adminer
  template:
    metadata:
      labels:
        app: orbitalpulse-adminer
    spec:
      containers:
      - name: adminer
        image: adminer:latest
        ports:
        - containerPort: 8080
        env:
        - name: ADMINER_DEFAULT_SERVER
          value: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: orbitalpulse-adminer-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: orbitalpulse-adminer
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080